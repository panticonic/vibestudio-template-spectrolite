systemEpoch: 0
defaultRepo: projects/default
defaultAgentConfig:
  model: openai-codex:gpt-5.6-sol
initPanels:
  - source: panels/chat
    stateArgs:
      initialPrompt: I just opened this workspace for the first time, help me get onboarded.
      systemPrompt: |
        You are the Vibestudio onboarding assistant. Welcome new users and help them make Vibestudio ready for the work they actually want to do. Setup is durable preparation; immediately usable capabilities and ordinary tasks are not unfinished setup.

        ## Opening turn

        Read `skills/onboarding/SKILL.md`, give a welcome of at most two short paragraphs, then render `skills/onboarding/SetupHub.tsx` with `inline_ui` using the stable ID `onboarding-setup-overview`. Do not run a leading `client_eval` or pass snapshot props; the checked-in component loads and caches capability state itself. The inline overview owns the onboarding UI; do not load or publish an action bar. If rendering is unavailable, give a concise plain-text fallback and do not invent status.

        ## Selection routing

        Inline UI choices arrive as a readable message plus a structured `interaction` object beside the readable user message. Never infer a route from the button label. For `kind: "onboarding-capability"`, use `client_eval` to statically import `executeOnboardingSelection` from `@workspace-skills/onboarding` and call it with the complete structured interaction object. This validates the catalog route in the inviting panel and performs About, panel, or shell navigation. If it returns `handled: false`, follow its returned owner target:
        - `owner-skill`: read the exact returned `ownerSkillPath` and use that
          capability's workflow.

        - `model-settings`: use the model-settings service and its existing
          provider/default workflow.

        - `conversation`: explain or start using the ready capability; do not
          invent setup status.


        Unknown or retired IDs are visible errors. There is no string-matching fallback.
        The component handles capability checks and manual refresh itself. After setup, reconnect, success, failure, or another relevant external change, render `SetupHub.tsx` again with the same stable ID and no snapshot props. This bumps the card and signals it to refresh. Do not claim that the card now shows a particular row, status, or action: owner state loads asynchronously and the card is the authoritative observation. Provider secrets are collected only through trusted credential APIs, never in chat or inline component state.

        ## Presentation rules

        Do not enumerate an independent feature menu, inspect private owner storage, count credentials as proof of a live connection, create completion flags, or report a universal setup score. Optional configuration is neutral unless a selected workflow failed. A connection with stored credentials is connected-unverified until the explicit live check succeeds.
        Ask one question at a time after the overview and adapt to the user's intent. Use `feedback_custom` when a setup workflow must wait for user input, `inline_ui` for durable observations, and the compact action bar only for preparing, resume, reopen, or retry state. This workspace may run on the selected local or self-hosted server; never claim that every operation runs on the user's current machine.
extensions:
  - source: extensions/git-bridge
  - source: extensions/image-service
  - source: extensions/pdf-ingest
  - source: extensions/file-tools
  - source: extensions/browser-data
  - source: extensions/shell
  - source: extensions/templates
  - source: extensions/test-runner
  - source: extensions/claude-code
providers:
  evalEngine:
    source: "@workspace/eval"
  evalRuntime:
    source: "@workspace/runtime"
  cdpClient:
    source: "@workspace/cdp-client"
  browserData:
    extension: extensions/browser-data
  gitInterop:
    extension: extensions/git-bridge
  claudeCode:
    extension: extensions/claude-code
services:
  - source: workers/workspace-source
    name: gad.workspace
    title: Workspace source
    action: manage your workspace files, history, and setup
    description: Manages your workspace's files, version history, and initial setup.
    notability: everyday
    presentation:
      domain: automation
      verb: manage
    protocols:
      - vibestudio.workspace-source.v1
      - vibestudio.gad.workspace.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
        - session
        - mission
    durableObject:
      className: GadWorkspaceDO
  - source: workers/pubsub-channel
    name: channel
    title: Conversations
    action: send and receive messages in your conversations
    description: Access your workspace's conversations, including sending messages and reading replies.
    notability: everyday
    presentation:
      domain: sharing
      verb: act
      substanceKind: send
    protocols:
      - vibestudio.channel.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
        - session
        - mission
    durableObject:
      className: PubSubChannel
      context: creator
  - source: workers/browser-data
    name: browser.data
    title: Browser data
    action: use browser history, bookmarks, downloads, and preferences
    description: Access your browser history, bookmarks, downloads, and saved preferences.
    notability: everyday
    presentation:
      domain: web
      verb: see
    protocols:
      - vibestudio.browser-data.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
    durableObject:
      className: BrowserDataDO
  - source: workers/workspace-presentation
    name: workspace.presentation
    title: Workspace presentation
    action: manage panel titles, search, and launcher usage
    description: Manage how panels, search results, and the app launcher are organized.
    notability: everyday
    presentation:
      domain: computer
      verb: manage
    protocols:
      - vibestudio.workspace-presentation.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
    durableObject:
      className: WorkspacePresentationDO
  - source: workers/model-settings
    name: models
    title: AI model settings
    action: read or change which AI models your workspace uses
    description: Read or change the AI model and provider settings for this workspace.
    notability: everyday
    presentation:
      domain: automation
      verb: manage
    protocols:
      - vibestudio.models.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
        - session
        - mission
    durableObject:
      className: ModelSettingsDO
  - source: workers/quickfire-service
    name: quickfire
    title: Command conversations
    action: manage panel-bound command conversations
    description: Owns durable Quickfire conversations attached to panel slots.
    notability: everyday
    presentation:
      domain: automation
      verb: manage
    protocols:
      - vibestudio.quickfire.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
    durableObject:
      className: QuickfireSessionsDO
  - source: workers/missions
    name: missions
    title: Automated tasks
    action: manage automated tasks
    description: Launch automated tasks immediately, then inspect and control their running definitions.
    notability: headline
    presentation:
      domain: automation
      verb: manage
    protocols:
      - vibestudio.missions.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
    durableObject:
      className: MissionsDO
singletonObjects:
  - source: workers/workspace-source
    className: GadWorkspaceDO
    key: workspace
  - source: workers/workspace-presentation
    className: WorkspacePresentationDO
    key: workspace-presentation
  - source: workers/model-settings
    className: ModelSettingsDO
    key: workspace-model-settings
  - source: workers/quickfire-service
    className: QuickfireSessionsDO
    key: workspace-quickfire
  - source: workers/missions
    className: MissionsDO
    key: workspace-missions
