template:
  name: System
  description: Your private client applications and device settings.
  repositories:
    - about/about
    - about/adblock
    - about/automations
    - about/credentials
    - about/help
    - about/keyboard-shortcuts
    - about/local-models
    - about/new
    - about/permissions
    - about/server-logs
    - about/testbench
    - about/templates
    - about/workspace-history
    - apps/mobile
    - apps/remote-cli
    - apps/shell
    - apps/terminal-browser
    - extensions/claude-code
    - extensions/file-tools
    - extensions/git-bridge
    - extensions/image-service
    - extensions/local-models
    - extensions/mobile-debug
    - extensions/pdf-ingest
    - extensions/react-native
    - extensions/shell
    - extensions/templates
    - extensions/test-runner
    - extensions/typecheck-service
    - panels/chat
    - panels/terminal
    - projects/default
    - skills/agentic-development
    - skills/agents
    - skills/api-integrations
    - skills/appdev
    - skills/architecture
    - skills/capabilities
    - skills/extensiondev
    - skills/gad-context
    - skills/local-models
    - skills/messaging
    - skills/mobile-system-testing
    - skills/performance
    - skills/phone-setup
    - skills/provenance-orientation
    - skills/remote-access
    - skills/sandbox
    - skills/templates
    - skills/server-logs
    - skills/system-testing
    - skills/terminal
    - skills/vibestudio-vcs
    - skills/web-research
    - skills/workspace-dev
    - workers/agent-worker
    - workers/development
    - workers/missions
    - workers/model-settings
    - workers/images
    - workers/phone-provisioning
    - workers/pubsub-channel
    - workers/quickfire-service
    - workers/silent-agent-worker
    - workers/system-agent
    - workers/system-test-runner
    - workers/test-agent
    - workers/testkit-driver
    - workers/workspace-presentation
    - workers/workspace-source
  files: []
systemEpoch: 0
defaultRepo: projects/default
defaultAgentConfig:
  model: openai-codex:gpt-5.6-sol
initPanels:
  - source: about/new
extensions:
  - source: extensions/git-bridge
  - source: extensions/image-service
  - source: extensions/pdf-ingest
  - source: extensions/file-tools
  - source: extensions/typecheck-service
  - source: extensions/test-runner
  - source: extensions/shell
  - source: extensions/templates
  - source: extensions/claude-code
  - source: extensions/mobile-debug
  - source: extensions/react-native
  - source: extensions/local-models
providers:
  evalEngine:
    source: "@workspace/eval"
  evalRuntime:
    source: "@workspace/runtime"
  cdpClient:
    source: "@workspace/cdp-client"
  gitInterop:
    extension: extensions/git-bridge
  claudeCode:
    extension: extensions/claude-code
services:
  - source: workers/workspace-source
    name: gad.workspace
    title: Workspace source
    action: manage your workspace files, history, and setup
    description: Manages your workspace's files, version history, and initial setup.
    notability: everyday
    presentation:
      domain: automation
      verb: manage
    protocols:
      - vibestudio.workspace-source.v1
      - vibestudio.gad.workspace.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
        - session
        - mission
    durableObject:
      className: GadWorkspaceDO
  - source: workers/pubsub-channel
    name: channel
    title: Conversations
    action: send and receive messages in your conversations
    description: Access your workspace's conversations, including sending messages and reading replies.
    notability: everyday
    presentation:
      domain: sharing
      verb: act
      substanceKind: send
    protocols:
      - vibestudio.channel.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
        - session
        - mission
    durableObject:
      className: PubSubChannel
      context: creator
  - source: workers/workspace-presentation
    name: workspace.presentation
    title: Workspace presentation
    action: manage panel titles, search, and launcher usage
    description: Manage how panels, search results, and the app launcher are organized.
    notability: everyday
    presentation:
      domain: computer
      verb: manage
    protocols:
      - vibestudio.workspace-presentation.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
    durableObject:
      className: WorkspacePresentationDO
  - source: workers/images
    name: images
    title: Generated image assets
    action: generate and manage reusable image assets
    description: Generate durable image assets, manage art direction, and read retained image content.
    notability: everyday
    presentation:
      domain: automation
      verb: manage
    protocols:
      - vibestudio.images.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
        - session
        - mission
    durableObject:
      className: ImagesDO
  - source: workers/model-settings
    name: models
    title: AI model settings
    action: read or change which AI models your workspace uses
    description: Read or change the AI model and provider settings for this workspace.
    notability: everyday
    presentation:
      domain: automation
      verb: manage
    protocols:
      - vibestudio.models.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
        - session
        - mission
    durableObject:
      className: ModelSettingsDO
  - source: workers/quickfire-service
    name: quickfire
    title: Command conversations
    action: manage panel-bound command conversations
    description: Owns durable Quickfire conversations attached to panel slots.
    notability: everyday
    presentation:
      domain: automation
      verb: manage
    protocols:
      - vibestudio.quickfire.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
    durableObject:
      className: QuickfireSessionsDO
  - source: workers/testkit-driver
    name: testkit-driver
    title: Test runner
    action: run workspace tests and record results
    description: Run this workspace's test suite and record results.
    notability: everyday
    presentation:
      domain: automation
      verb: act
    protocols:
      - vibestudio.testkit-driver.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
        - session
    durableObject:
      className: TestkitDriverDO
  - source: workers/phone-provisioning
    name: phone.provisioning
    title: Connected phones
    action: manage connected phones
    description: Discover, install, and pair phones through a connected desktop.
    notability: headline
    presentation:
      domain: people
      verb: manage
    protocols:
      - vibestudio.phone-provisioning.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
    durableObject:
      className: PhoneProvisioningDO
  - source: workers/development
    name: development
    title: Development
    action: manage development sessions
    description: Build and test workspace changes before they're saved.
    notability: everyday
    presentation:
      domain: automation
      verb: manage
    protocols:
      - vibestudio.development.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
    durableObject:
      className: DevelopmentDO
  - source: workers/missions
    name: missions
    title: Automated tasks
    action: manage automated tasks
    description: Launch automated tasks immediately, then inspect and control their running definitions.
    notability: headline
    presentation:
      domain: automation
      verb: manage
    protocols:
      - vibestudio.missions.v1
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
    durableObject:
      className: MissionsDO
singletonObjects:
  - source: workers/workspace-source
    className: GadWorkspaceDO
    key: workspace
  - source: workers/workspace-presentation
    className: WorkspacePresentationDO
    key: workspace-presentation
  - source: workers/model-settings
    className: ModelSettingsDO
    key: workspace-model-settings
  - source: workers/images
    className: ImagesDO
    key: workspace-images
  - source: workers/quickfire-service
    className: QuickfireSessionsDO
    key: workspace-quickfire
  - source: workers/testkit-driver
    className: TestkitDriverDO
    key: workspace-testkit-driver
  - source: workers/phone-provisioning
    className: PhoneProvisioningDO
    key: workspace-phone-provisioning
  - source: workers/development
    className: DevelopmentDO
    key: workspace-development
  - source: workers/missions
    className: MissionsDO
    key: workspace-missions
apps:
  - source: apps/shell
  - source: apps/mobile
  - source: apps/remote-cli
hostTargets:
  electron:
    app: apps/shell
  react-native:
    app: apps/mobile
    requiresExtensions:
      - extensions/react-native
  terminal:
    app: apps/remote-cli
trust:
  chromeApps:
    - apps/shell
    - apps/mobile
